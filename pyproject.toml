[project]
name = "benvenuto"
version = "1.4.0"
description = "Benvenuto: Banca Futura's new-hire onboarding portal (synthetic data)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markdown>=3.6",
    "httpx>=0.27",
    "google-auth>=2.35",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx`"]
